[project]
name = "paispl-m3"
version = "0.3.0"
description = "PAISPL M3 deterministic incremental artifact generator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
paispl-m3 = "paispl_m3.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

