[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paispl-m4"
version = "0.4.0"
description = "PAISPL controlled UML round-trip change controller"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
paispl-m4 = "paispl_m4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
