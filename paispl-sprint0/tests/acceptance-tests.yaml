  - {id: AT-AUTH-002, level: policy, requirement_ids: [FR-001], feature_ids: [mfa, zero_trust], assertion: 보호 자원 접근에는 MFA와 정책 검사가 필요하다.}
  - {id: AT-IMG-001, level: contract, requirement_ids: [FR-002], feature_ids: [dicom_gateway, mri_adapter], assertion: MRI DICOM 객체가 STOW RS 계약으로 수신된다.}
  - {id: AT-IMG-002, level: contract, requirement_ids: [FR-002], feature_ids: [dicom_gateway, ct_adapter], assertion: CT Study가 QIDO RS로 조회된다.}
